<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#2c3e50"/>
  
  <!-- Subtle pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#34495e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Logo icon - document with lock -->
  <g transform="translate(100, 165)">
    <!-- Document body -->
    <path d="M0 40C0 17.9 17.9 0 40 0H160L240 80V260C240 282.1 222.1 300 200 300H40C17.9 300 0 282.1 0 260V40Z" fill="#ecf0f1"/>
    <!-- Document fold -->
    <path d="M160 0V80H240L160 0Z" fill="#bdc3c7"/>
    <!-- Document lines -->
    <rect x="40" y="120" width="80" height="16" rx="8" fill="#bdc3c7"/>
    <rect x="40" y="156" width="120" height="16" rx="8" fill="#bdc3c7"/>
    <rect x="40" y="192" width="100" height="16" rx="8" fill="#bdc3c7"/>
    
    <!-- Lock body -->
    <rect x="140" y="200" width="120" height="100" rx="16" fill="#27ae60"/>
    <!-- Lock shackle -->
    <path d="M165 200V160C165 132 185 112 200 112S235 132 235 160V200" stroke="#27ae60" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- Lock keyhole -->
    <circle cx="200" cy="250" r="16" fill="#1e8449"/>
    <rect x="194" y="250" width="12" height="28" rx="6" fill="#1e8449"/>
  </g>
  
  <!-- Text content -->
  <text x="420" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">SecuPaste</text>
  
  <text x="420" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#bdc3c7">Post-Quantum Encrypted File Sharing</text>
  
  <!-- Feature badges -->
  <g transform="translate(420, 400)">
    <!-- Kyber badge -->
    <rect x="0" y="0" width="180" height="50" rx="25" fill="#27ae60"/>
    <text x="90" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">ML-KEM (Kyber)</text>
    
    <!-- AES badge -->
    <rect x="200" y="0" width="160" height="50" rx="25" fill="#3498db"/>
    <text x="280" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">AES-256-GCM</text>
    
    <!-- Argon2 badge -->
    <rect x="380" y="0" width="140" height="50" rx="25" fill="#9b59b6"/>
    <text x="450" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">Argon2id</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#7f8c8d" text-anchor="middle">Quantum-resistant encryption for your sensitive files</text>
</svg>
